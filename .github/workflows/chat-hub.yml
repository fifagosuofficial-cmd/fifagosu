name: chat-hub-setup
on:
  push:
    branches: [feature/home-chat-private-feedback]
    paths: ['workers/chat-hub/**', '.github/workflows/chat-hub.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy private WebSocket hub
        run: npx --yes wrangler@4 deploy --config workers/chat-hub/wrangler.toml
      - name: Add only chat namespace binding to existing Pages project
        run: python workers/chat-hub/bind.py
