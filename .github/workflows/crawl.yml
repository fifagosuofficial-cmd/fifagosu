# 피파고수: 매일 데이터센터 수집 → data 브랜치에 저장 → Cloudflare Pages 배포
name: crawl-and-deploy

on:
  schedule:
    - cron: "17 18 * * *"        # 매일 03:17 (한국 시간)
  workflow_dispatch:
    inputs:
      minutes:
        description: "전체 카드 일일 스냅샷 수집 시간(분)"
        default: "300"
  push:
    branches: [main, renewal]    # 사이트 코드를 고치면 수집 없이 배포만 (renewal은 미리보기 주소로)

permissions:
  contents: write

concurrency:
  # 코드 수정(push) 배포는 긴 수집이 도는 중에도 바로 나가도록 수집과 줄을 따로 서요.
  group: ${{ github.event_name == 'push' && format('deploy-{0}', github.ref_name) || 'crawl' }}
  cancel-in-progress: false

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest       # 넥슨이 해외 IP를 막으면 self-hosted(내 PC)로 바꾸세요. README 참고
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 이전 수집 데이터 가져오기 (data 브랜치)
        run: |
          if git fetch --depth=1 origin data:refs/remotes/origin/data 2>/dev/null; then
            git checkout origin/data -- data && git reset -q data
            echo "data: $(find data -name '*.json' | wc -l) files"
          else
            echo "data 브랜치 없음 — 처음부터 수집"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        if: github.event_name != 'push'
        run: |
          pip install -q -r crawler/requirements.txt
          python crawler/fgcrawl.py daily --minutes "${{ github.event.inputs.minutes || vars.CRAWL_MINUTES || '300' }}"

      - name: 챔피언스 평균 평점 (전적 진단 '평점 낮음' 기준)
        if: github.event_name != 'push'
        continue-on-error: true      # 실패해도 이전 data/rating.json 을 그대로 두고 다음 단계 진행
        timeout-minutes: 15
        env:
          RATING_SEEDS: ${{ vars.RATING_SEEDS }}   # 시작 닉네임 추가(쉼표로 구분, 선택)
        run: python crawler/rating.py --api https://fifagosu.com/api

      - name: FG INDEX 장기 이력 누적 (전체 스냅샷만 사용)
        if: github.event_name != 'push'
        run: python crawler/fg_index.py data

      - name: data 브랜치에 저장 (기록 없이 최신 1개만 유지)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d data ] || { echo "저장할 데이터 없음"; exit 0; }
          tmp=$(mktemp -d)
          cp -r data "$tmp/"
          cd "$tmp"
          git init -q -b data
          git config user.name "fifagosu-bot"
          git config user.email "fifagosu-bot@users.noreply.github.com"
          git add data
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: 배포 폴더 만들기
        if: env.CF_TOKEN != ''
        run: |
          # 긴 수집 중에 사이트 코드가 바뀌었을 수 있으니, 수집 실행은 최신 사이트 코드로 빌드해요.
          if [ "${{ github.event_name }}" != "push" ]; then
            if git fetch -q --depth=1 origin "${{ github.ref_name }}"; then
              for p in site functions fun crawler/fg_index.py; do git checkout -q FETCH_HEAD -- "$p" 2>/dev/null || true; done
            fi
          fi
          # 새 진단 기능에 필요한 정적 데이터는 배포할 때도 생성해요. 외부 API 호출 없음.
          if [ "${{ github.event_name }}" = "push" ]; then
            test -f data/index.json
            pip install -q -r crawler/requirements.txt
            python -c 'import sys; from pathlib import Path; sys.path.insert(0, "crawler"); import derive; d=Path("data"); date=derive.today_kst(); m=derive.step_diag_market(d,date); t=derive.step_opponent_teamcolors(d,date); print(m,t); assert m.get("diag_market_cards",0)>0 and t.get("opponent_teamcolor_cards",0)>0; assert (d/"diag/market.json").is_file() and (d/"diag/opponent-teamcolors.json").is_file()'
          fi
          mkdir -p dist
          if [ -f site/build.py ]; then
            pip install -q -r site/requirements.txt
            python site/build.py --data data --out dist      # 사이트 HTML·CSS·JS·필수 페이지·robots·sitemap·404·fun
          else
            cp index.html dist/
            cp -r fun dist/
            mkdir -p dist/site/brand && cp site/brand/fifagosu-logo-480.* dist/site/brand/
          fi
          cp -r functions dist/
          if [ -d data ]; then cp -r data dist/ && rm -f dist/data/state.json; fi

      - name: Check Pages asset sizes
        if: env.CF_TOKEN != ''
        run: |
          rm -f dist/data/market/summary.json
          python -c 'from pathlib import Path; bad=[str(p) for p in Path("dist").rglob("*") if p.is_file() and p.stat().st_size>25*1024*1024]; print("Oversized files:", bad); assert not bad'
      - name: Cloudflare Pages 배포
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist
          command: pages deploy . --project-name=fifagosu --branch=${{ github.ref_name == 'main' && 'main' || 'renewal' }}

      - name: 운영 채팅 화면 및 WebSocket 확인
        if: github.event_name == 'push' && github.ref_name == 'main' && env.CF_TOKEN != ''
        run: python tools/verify_social_live.py
