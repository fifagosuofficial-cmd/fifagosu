name: test
on:
  pull_request:
  push:
    paths: ["crawler/**", "site/**", "fun/**", "functions/**", "tests/**", ".github/workflows/test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r crawler/requirements.txt -r site/requirements.txt pytest && pytest -q tests
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --check site/assets/js/material-engine.js && node --check site/assets/js/sim.js && node --check site/assets/js/ads.js && node --check site/assets/js/community.js && node --input-type=module --check < "functions/api/community/[[path]].js" && node --check site/assets/js/app.js && node --check site/assets/js/squad.js && node --check site/assets/js/squad-worker.js && node --check site/assets/js/squad-bonus.js && node --test tests/test_ads_layout.cjs tests/test_diag_analysis.cjs tests/test_diag_favorites.cjs tests/test_squad_engine.cjs tests/test_squad_bonus.cjs tests/test_community_api.cjs tests/test_material_engine.cjs

      - name: 공식 재료비 운영 API 진단 (공개 데이터 1건)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import json, math, urllib.request, urllib.error
          base='https://fifagosu.com'
          def get(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'FIFAGOSU-Healthcheck/1.0'}),timeout=45) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: return e.code,json.load(e)
                  except Exception: return e.code,{}
          status,cache=get('/api/boost?cached=1')
          print('cache_http',status,'verified',len(cache.get('items',[])),flush=True)
          status,pool=get('/data/market/pool.json')
          if status!=200 or not pool.get('items'): print('pool_http',status); raise SystemExit(0)
          seen={(x['spid'],x['grade']) for x in cache.get('items',[])}
          probs=[0,1,.81,.64,.5,.26,.15,.07,.05,.04,.03,.02,.01]
          choices=[]
          for id,name,ovr,pr in pool['items']:
              for g in range(1,min(len(pr),13)):
                  buy,up=pr[g-1:g+1]
                  if not buy or not up or buy<1e6 or (int(id),g) in seen: continue
                  gain=.6*up-buy
                  if gain<=0: continue
                  score=50*min(1,math.log1p(gain/buy)/math.log(11))+30*probs[g]+20*min(1,math.log1p(gain/1e8)/math.log1p(1000))
                  choices.append((score,int(id),g))
          if not choices: print('no uncached candidate'); raise SystemExit(0)
          score,id,g=max(choices)
          status,result=get(f'/api/boost?spid={id}&grade={g}')
          print('probe',id,g,'http',status,'code',result.get('code'),'reason',result.get('reason'),'verified',bool(result.get('plan')),flush=True)
          PY
