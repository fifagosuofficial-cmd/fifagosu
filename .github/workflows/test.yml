name: test
on:
  pull_request:
  push:
    paths: ["crawler/**", "site/**", "fun/**", "functions/**", "tests/**", ".github/workflows/test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r crawler/requirements.txt -r site/requirements.txt pytest && pytest -q tests
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --check site/assets/js/app.js && node --check site/assets/js/squad.js && node --check site/assets/js/squad-worker.js && node --test tests/test_diag_analysis.cjs tests/test_diag_favorites.cjs tests/test_squad_engine.cjs
