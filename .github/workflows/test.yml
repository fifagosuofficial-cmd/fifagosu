name: test
on:
  pull_request:
  push:
    paths: ["crawler/**", "tests/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r crawler/requirements.txt pytest && pytest -q tests
