<style>
/* 킥킥: 축구 심심풀이 테스트 모음.
   구조는 하나(세로 한 컬럼, 엄지로 누르는 큰 버튼), 색과 배경 무늬만 콘텐츠마다 바뀌어요.
   --bg/--bg2: 바탕과 줄무늬, --acc/--ai: 강조색과 그 위 글자색, --tx/--dim: 본문/보조 글자, --qb/--qt: 질문 카드 */
:root{
  --bg:#0d3b2a;--bg2:#114a34;--acc:#f5c518;--ai:#1d1a05;--tx:#eef3ea;--dim:#a9bfb1;--line:rgba(238,243,234,.16);
  --qb:#eef3ea;--qt:#14261d;--qline:#cfdad1;--qsel:#f5c518;--pat:none;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-num:"Oswald","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);background-image:var(--pat);background-attachment:fixed;color:var(--tx);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh;transition:background-color .25s}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}

/* 머리말 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.brand i{width:13px;height:18px;background:var(--acc);border-radius:2px;transform:rotate(10deg);display:inline-block}
.brand small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.04em}
.allbtn{border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700;text-decoration:none;background:rgba(0,0,0,.14)}

/* 광고 자리 (버튼과 24px 이상 떨어뜨려 오클릭 방지) */
.ad{display:grid;gap:4px;justify-items:center}
.ad .adl{font-size:10px;letter-spacing:.14em;color:var(--dim)}
.ad .slot{width:100%;display:grid;place-items:center;overflow:hidden}
.ad .ph{width:100%;max-width:336px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-size:12px;color:var(--dim);background:rgba(0,0,0,.1)}
#adTop .ph{min-height:90px}#adBot{margin-top:12px}#adBot .ph{min-height:250px}

/* 허브 */
.hub-hero{display:grid;gap:8px;padding-top:4px}
.hub-hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,10vw,48px);line-height:1.08;text-wrap:balance}
.hub-hero p{margin:0;color:var(--dim);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:grid;align-content:start;gap:6px;min-height:150px;padding:14px 14px 12px;border-radius:16px;text-decoration:none;color:var(--t-tx);background:var(--t-bg);border:1px solid rgba(255,255,255,.08);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.22);touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.16)}
.tile:active{transform:scale(.98)}
.tile .ic{width:34px;height:34px;border-radius:10px;background:var(--t-acc);color:var(--t-ai);display:grid;place-items:center}
.tile .ic svg{width:20px;height:20px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.2;word-break:keep-all}
.tile span{font-size:12.5px;line-height:1.45;color:var(--t-dim);word-break:keep-all}
.tile em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--t-acc);margin-top:auto}
.tile.wide{grid-column:1/-1;min-height:120px;grid-template-columns:auto 1fr;column-gap:12px}
.tile.wide .ic{grid-row:span 3;width:52px;height:52px;border-radius:14px}
.tile.wide .ic svg{width:30px;height:30px}
.tile.wide b{font-size:23px}
@media (max-width:340px){.grid{grid-template-columns:1fr}}

/* 콘텐츠 첫 화면 */
.intro{display:grid;gap:14px}
.intro .kick{font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--acc)}
.intro h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(36px,11vw,54px);line-height:1.06;text-wrap:balance;word-break:keep-all}
.intro p{margin:0;color:var(--dim);word-break:keep-all}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.1)}
.facts b{display:block;font-family:var(--f-num);font-size:22px;line-height:1.15}
.facts span{font-size:12px;color:var(--dim)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--dim)}
.field input{border:2px solid var(--line);background:rgba(0,0,0,.14);color:var(--tx);border-radius:12px;padding:14px 16px;font-size:18px;font-weight:700;width:100%;box-sizing:border-box}
.field input:focus{border-color:var(--acc);outline:none}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.pair .amp{font-family:var(--f-display);font-size:26px;color:var(--acc);padding-bottom:12px}
.cta{display:block;width:100%;border:0;border-radius:14px;background:var(--acc);color:var(--ai);font-weight:900;font-size:18px;padding:16px 18px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.cta:disabled{opacity:.45}
.ghost{border:1px solid var(--line);background:rgba(0,0,0,.14);color:var(--tx);border-radius:12px;padding:12px 14px;font-weight:700}
.ghost:disabled{opacity:.4}
.note{font-size:12px;color:var(--dim);margin:0}

/* 질문 */
.qhead{display:grid;gap:8px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
.qmeta .n{font-family:var(--f-num);font-size:20px;color:var(--tx)}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.qcard{background:var(--qb);color:var(--qt);border-radius:18px;padding:20px 18px 18px;display:grid;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.qcard .tag{font-size:12px;font-weight:700;letter-spacing:.1em;opacity:.7}
.qcard h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(23px,6.4vw,29px);line-height:1.28;text-wrap:balance;word-break:keep-all}
.answers{display:grid;gap:10px}
.answers button{text-align:left;border:2px solid var(--qline);background:rgba(255,255,255,.75);color:var(--qt);border-radius:12px;padding:13px 14px;font-weight:700;font-size:16px;display:flex;gap:12px;align-items:center;word-break:keep-all}
.answers button[aria-pressed="true"]{border-color:var(--qt);background:var(--qsel)}
.answers .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.08);font-family:var(--f-num);font-size:14px}
.answers.t-ab{grid-template-columns:1fr auto 1fr;align-items:stretch}
.answers.t-ab button{flex-direction:column;justify-content:center;text-align:center;min-height:118px;font-size:16.5px}
.answers .abk{font-family:var(--f-num);font-size:26px;opacity:.6}
.answers .vs{align-self:center;font-family:var(--f-num);font-weight:700;font-size:18px;color:#e2453c}
@media (max-width:380px){.answers.t-ab{grid-template-columns:1fr}.answers .vs{justify-self:center}}
.sl{display:grid;gap:12px}
.sl output{font-family:var(--f-num);font-size:56px;line-height:1;text-align:center}
.sl output small{font-size:20px;margin-left:4px;font-family:var(--f-body)}
.sl input{width:100%;accent-color:var(--qt);height:32px}
.slscale{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips button{border:2px solid var(--qline);background:rgba(255,255,255,.75);color:var(--qt);border-radius:12px;padding:12px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--qsel);border-color:var(--qt)}
.next{border:0;border-radius:12px;background:var(--qt);color:var(--qb);padding:14px;font-weight:900;font-size:16px;text-align:center}
.next:disabled{opacity:.4;cursor:not-allowed}
.qnav{display:flex;justify-content:space-between;gap:10px}

/* 퀴즈(사진) */
.photo{position:relative;width:100%;aspect-ratio:4/3;max-height:34svh;border-radius:16px;overflow:hidden;background:rgba(0,0,0,.25);display:grid;place-items:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transition:filter .2s linear}
.photo .miss{font-size:13px;color:var(--qt);opacity:.7;padding:20px;text-align:center}
.timer{height:6px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden}
.timer i{display:block;height:100%;background:var(--qt)}
.answers button.ok{background:#3ccf7a;border-color:#1c7a45;color:#06210f}
.answers button.no{background:#ff8a8a;border-color:#a32b2b;color:#2a0606}
.react{font-weight:700;font-size:15px;line-height:1.55;margin:0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.06);word-break:keep-all}
.credit{font-size:11px;opacity:.7;margin:0;text-align:center}
.coach-match{width:100%;display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg2)}
.coach-match img{width:112px;height:112px;object-fit:cover;object-position:center 28%;border-radius:50%;border:2px solid var(--acc);background:var(--bg)}
.coach-match p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
.coach-match h2{margin:3px 0 5px;font-size:20px;color:var(--tx)}
.coach-disclaimer{width:100%;margin:0;color:var(--dim);font-size:11px;text-align:center}

/* 결과 */
.res{display:grid;gap:12px;justify-items:center}
.res .shot{display:block;max-width:100%;max-height:max(360px,calc(100svh - 330px));width:auto;height:auto;aspect-ratio:9/16;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.acts{width:100%;display:grid;gap:8px}
.acts .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.acts .ghost{padding:11px 6px;font-size:14px}
.more{width:100%;display:grid;gap:8px;margin-top:6px}
.more h3{margin:0;font-size:14px;color:var(--dim);font-weight:700}
.more .grid .tile{min-height:120px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff;color:#111;font-weight:700;padding:10px 16px;border-radius:99px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:9;max-width:90vw;text-align:center;word-break:keep-all}
footer{font-size:11px;color:var(--dim);text-align:center;line-height:1.7;margin-top:8px}
/* 공유 장치 · 결과 링크 */
.acts .share3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .share3 .cta{grid-column:1/-1}
.acts .sharenote{font-size:12px;color:var(--dim);margin:0;text-align:center}
.acts .inapp{font-size:13px;font-weight:700;margin:0;text-align:center;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.18)}
.linkbox{width:100%;display:grid;gap:6px;padding:12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);box-sizing:border-box}
.linkbox input{width:100%;box-sizing:border-box;border:2px solid var(--acc);border-radius:10px;padding:10px 12px;background:rgba(0,0,0,.25);color:var(--tx);font-size:14px}
.linkbox p{margin:0;font-size:13px;font-weight:700}
.friend{width:100%;box-sizing:border-box;border-radius:14px;padding:12px 14px;background:var(--acc);color:var(--ai);font-weight:900;font-size:15px;line-height:1.45;word-break:keep-all}
.friend small{display:block;font-weight:700;font-size:12px;opacity:.8}
.namecall{font-size:12px;color:var(--dim);margin:0;text-align:center}
.nicks{width:100%;box-sizing:border-box;font-size:14px;line-height:1.6;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);word-break:keep-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.arc-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;border-radius:12px;border:1px solid var(--line);background:#0002}.arc-tabs a{padding:10px;text-align:center;font-size:14px;font-weight:800;text-decoration:none;color:var(--dim);border-radius:8px}.arc-tabs a[aria-current=page]{background:var(--acc);color:var(--ai)}
.arcade{display:grid;gap:12px;min-width:0}.arcade h1,.arcade h2,.arcade p{margin:0}.arcade h1{font:400 36px/1.15 var(--f-display)}.arcade h2{font-size:18px}.arcade small,.arc-muted{color:var(--dim);font-size:12px}.arc-summary{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:14px;background:#ffffff0d;border:1px solid var(--line);border-radius:14px}.arc-xp{font:700 25px var(--f-num);color:var(--acc)}.arc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.arc-tile{display:grid;gap:7px;text-align:left;padding:14px;border:1px solid var(--line);background:#144a36;border-radius:14px;color:#eff7f2;min-width:0}.arc-tile:disabled{opacity:.5}.arc-tile .arc-emoji{font-size:30px}.arc-tile b{font-size:16px;word-break:keep-all}.arc-tile small{color:#c3dfce;line-height:1.45;word-break:keep-all}.arc-tile em{font-size:12px;font-style:normal;color:#f5c518;font-weight:700}.arc-panel{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0002}.arc-rank summary{font-weight:700;cursor:pointer}.arc-rank ol{padding-left:24px;margin:5px 0}.arc-rank li{padding:4px 0}.arc-rank li span{float:right;color:var(--acc)}.arc-game-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.arc-progress{height:7px;background:#fff2;border-radius:10px;overflow:hidden}.arc-progress i{display:block;height:100%;background:var(--acc)}.arc-answers{display:grid;gap:8px}.arc-choice{min-height:56px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff1;color:var(--tx);font-weight:700;word-break:keep-all}.arc-choice:disabled{opacity:.5}.arc-goal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:repeating-linear-gradient(0deg,transparent 0 19px,#ffffff44 20px 21px),repeating-linear-gradient(90deg,#ffffff08 0 19px,#ffffff44 20px 21px),#1d513d;padding:9px;border:5px solid #e8f5ed;border-bottom:0;border-radius:6px 6px 0 0;min-height:130px}.arc-goal button{background:#163a2a88;border:1px solid #ffffff88;border-radius:8px;color:white;display:grid;place-items:center;font-size:14px;gap:3px}.arc-goal button span{font-size:34px}.arc-goal button.blocked{background:#b85b4a88}.arc-field{text-align:center;font-size:36px;padding:4px}.arc-timing{height:28px;position:relative;border-radius:8px;background:#06251a;overflow:hidden;border:1px solid var(--line)}.arc-target{height:100%;position:absolute;background:#35d38888}.arc-marker{height:100%;width:4px;position:absolute;background:#fff;border-radius:4px;left:0}.arc-feedback{font-weight:700;color:#f5c518;min-height:20px}.arc-result{font-size:50px;font-family:var(--f-num);color:var(--acc);text-align:center}.arc-notice{color:var(--dim);font-size:12px;word-break:keep-all}.arc-error{color:#ffb8ad;font-size:13px}.arcade a.cta{text-align:center;box-sizing:border-box;text-decoration:none}.arc-grid button:focus-visible{outline:3px solid var(--acc)}

<style>
/* ---- 피파고수 산하 코너용 추가 스타일 (원본 claude.ai 래퍼의 기본값 일부 + 피파고수 머리띠) ---- */
img{max-width:100%}

function comment(me,best,cand){

function applyTheme(th){
  const r=document.documentElement.style;
  const m={bg:'--bg',bg2:'--bg2',acc:'--acc',ai:'--ai',tx:'--tx',dim:'--dim',line:'--line',qb:'--qb',qt:'--qt',qline:'--qline',qsel:'--qsel'};
  for(const k in m)r.setProperty(m[k],th[k]);
  r.setProperty('--pat',th.css||'none');

/* =================== 캔버스 (1080×1920 인스타 스토리) =================== */
const W=1080,H=1920,CX=540;
const FONT={d:s=>`400 ${s}px "Black Han Sans"`,b:(s,w=700)=>`${w} ${s}px "Noto Sans KR"`,n:(s,w=700)=>`${w} ${s}px "Oswald"`};
async function fontsReady(){try{await Promise.all(['400 120px "Black Han Sans"','700 40px "Noto Sans KR"','900 40px "Noto Sans KR"','500 40px "Noto Sans KR"','700 80px "Oswald"'].map(f=>document.fonts.load(f,'가A1')))}catch{}}
function newCanvas(){const c=document.createElement('canvas');c.width=W;c.height=H;return c}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fit(ctx,text,maxW,size,fontFn,min=26){let s=size;do{ctx.font=fontFn(s);if(ctx.measureText(text).width<=maxW)break;s-=3}while(s>min);return s}
function wrapText(ctx,text,maxW){
  const lines=[];let cur='';
  for(const w of String(text).split(' ')){
    const t=cur?cur+' '+w:w;if(ctx.measureText(t).width<=maxW){cur=t;continue}
    if(cur)lines.push(cur);cur='';let piece='';
    for(const ch of w){if(ctx.measureText(piece+ch).width>maxW){lines.push(piece);piece=''}piece+=ch}cur=piece;
  }
  if(cur)lines.push(cur);return lines;
}
// 글자 쓰기: 가운데 정렬 기본, 넘치면 줄임
function txt(ctx,s,x,y,{font,color,align='center',max=960}={}){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';
  if(max&&ctx.measureText(s).width>max){const m=/(\d+)px/.exec(font);const size=+m[1];const f=font.replace(/\d+px/,'{s}px');ctx.font=f.replace('{s}',fit(ctx,s,max,size,z=>f.replace('{s}',z)))}
  ctx.fillText(s,x,y)}
// 여러 줄 글 상자. 돌려주는 값 = 상자 아래쪽 y
function para(ctx,s,{x=90,y,w=900,size=38,lh=1.48,color,weight=700,max=6,align='left'}){ctx.font=FONT.b(size,weight);const ls=wrapText(ctx,s,w).slice(0,max);ctx.fillStyle=color;ctx.textAlign=align;ls.forEach((l,i)=>ctx.fillText(l,align==='center'?x+w/2:x,y+size+i*size*lh));return y+size*0.3+ls.length*size*lh}
function chipRow(ctx,items,y,{fill,ink,stroke,size=32,gap=14,padX=26,h=62}){
  ctx.font=FONT.b(size);const ws=items.map(s=>ctx.measureText(s).width+padX*2);const total=ws.reduce((a,b)=>a+b,0)+gap*(items.length-1);let x=CX-total/2;
  items.forEach((s,i)=>{rr(ctx,x,y,ws[i],h,h/2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=4;ctx.stroke()}ctx.fillStyle=ink;ctx.textAlign='left';ctx.fillText(s,x+padX,y+h/2+size*0.36);x+=ws[i]+gap});
}
// 배경 무늬
function drawPattern(ctx,th){
  ctx.fillStyle=th.bg;ctx.fillRect(0,0,W,H);
  const p=th.pat;ctx.save();
  if(p==='stripes'){for(let i=0;i<15;i++){if(i%2){ctx.fillStyle=th.bg2;ctx.fillRect(0,i*128,W,128)}}}
  else if(p==='rows'){for(let i=0;i<30;i++){if(i%2){ctx.fillStyle=th.bg2;ctx.fillRect(0,i*64,W,64)}}}
  else if(p==='grid'){ctx.strokeStyle=th.bg2;ctx.lineWidth=2;for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
  else if(p==='paper'){ctx.fillStyle=th.bg2;for(let y=40;y<H;y+=56){ctx.fillRect(0,y,W,2)}}
  else if(p==='scarf'){ctx.translate(W/2,H/2);ctx.rotate(-.5);for(let i=-30;i<30;i++){if(i%2){ctx.fillStyle=th.bg2;ctx.fillRect(i*80,-1600,80,3200)}}}
  else if(p==='diamond'){ctx.fillStyle=th.bg2;for(let y=0;y<H+80;y+=120)for(let x=(y/120%2)*60;x<W+60;x+=120){ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+30,y);ctx.lineTo(x,y+30);ctx.lineTo(x-30,y);ctx.fill()}}
  else if(p==='mesh'){ctx.fillStyle=th.bg2;for(let y=0;y<H;y+=28)for(let x=(y/28%2)*14;x<W;x+=28){ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()}}
  else if(p==='rings'){ctx.strokeStyle=th.bg2;ctx.lineWidth=5;for(let r=80;r<1500;r+=110){ctx.beginPath();ctx.arc(CX,760,r,0,Math.PI*2);ctx.stroke()}}
  else if(p==='digits'){ctx.fillStyle=th.bg2;ctx.font=FONT.n(260);ctx.textAlign='center';const r=rng(7);for(let y=230;y<H+200;y+=260)for(let x=120;x<W+100;x+=280)ctx.fillText(String(1+Math.floor(r()*99)),x+(y/260%2)*120,y)}
  else if(p==='split'){ctx.fillStyle=th.bg2;ctx.beginPath();ctx.moveTo(0,H*.55);ctx.lineTo(W,H*.45);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
  else if(p==='film'){ctx.fillStyle=th.bg2;ctx.fillRect(0,0,70,H);ctx.fillRect(W-70,0,70,H);ctx.fillStyle=th.bg;for(let y=20;y<H;y+=70){rr(ctx,18,y,34,40,6);ctx.fill();rr(ctx,W-52,y,34,40,6);ctx.fill()}}
  else if(p==='globe'){ctx.strokeStyle=th.bg2;ctx.lineWidth=4;for(let i=1;i<9;i++){ctx.beginPath();ctx.ellipse(CX,760,560,560*Math.abs(Math.cos(i*Math.PI/9)),0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(CX,760,560*Math.abs(Math.cos(i*Math.PI/9)),560,0,0,Math.PI*2);ctx.stroke()}}
  ctx.restore();
}
// 카드 머리말·꼬리말 (위아래 250px은 인스타 UI에 가려질 수 있어 핵심 정보는 넣지 않아요)
function cardFrame(ctx,th,title,opt={}){
  drawPattern(ctx,th);
  ctx.font=FONT.d(40);const label='킥킥 · '+title;const w=ctx.measureText(label).width;

/* =================== 결과 링크 (/fun/r/?d=<base64url>, v1) ===================
   d = base64url(UTF-8 "v1|종류|…") · 같은 규칙을 functions/fun/r/[[path]].js 에도 복제해 뒀어요(바꿀 땐 둘 다).
   name : v1|name|입력이름|답변코드10|k|별명     duo : v1|duo|A|B|라벨
   유형형: v1|manager·fan·club|결과키|유형명      go  : v1|go|ifplayer·balance·blur·price|라벨 */
const D_BAD=/[^가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9 .,!?%()'·×~#-]/g;
const dClean=s=>String(s??'').replace(D_BAD,'').replace(/\s+/g,' ').trim();
const TYPE_APPS=['manager','fan','club'],GO_APPS=['ifplayer','balance','blur','price'];
function b64e(str){const b=new TextEncoder().encode(str);let bin='';b.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(d){if(!/^[A-Za-z0-9_-]{4,400}$/.test(d||''))return null;try{const bin=atob(d.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}catch{return null}}
function parseD(d){
  const raw=b64d(d);if(raw==null)return null;const f=raw.split('|');
  if(!/^v\d{1,3}$/.test(f[0]))return null;
  if(f[0]!=='v1'){const label=dClean(f[f.length-1]).slice(0,30);return label?{v:f[0],label}:null}   // 미래 버전: 글자만 보여줌
  const nm=x=>{x=dClean(x).replace(/\s/g,'');return x.length>=1&&x.length<=6?x:null};
  const tx=(x,n)=>{x=dClean(x);return x&&x.length<=n?x:null};
  if(f[1]==='name'&&f.length===6){const n=nm(f[2]),nick=tx(f[5],24);if(n&&/^[0-3]{10}$/.test(f[3])&&/^[0-2]$/.test(f[4])&&nick)return {v:'v1',kind:'name',app:'name',name:n,code:f[3],k:+f[4],label:nick};return null}
  if(f[1]==='duo'&&f.length===5){const a=nm(f[2]),b=nm(f[3]),l=tx(f[4],30);if(a&&b&&l)return {v:'v1',kind:'duo',app:'duo',a,b,label:l};return null}
  if(TYPE_APPS.includes(f[1])&&f.length===4){const l=tx(f[3],30);if(/^[a-z0-9]{1,10}$/.test(f[2])&&l)return {v:'v1',kind:'type',app:f[1],key:f[2],label:l};return null}
  if(f[1]==='go'&&f.length===4&&GO_APPS.includes(f[2])){const l=tx(f[3],30);if(l)return {v:'v1',kind:'go',app:f[2],label:l};return null}
  return null;
}
// 결과 링크 만들기. 라벨류는 허용 문자만 남기고 길이를 잘라요(내가 만든 링크가 내 검증에서 떨어지지 않게).
function mkLink(kind,...parts){
  let f;
  if(kind==='name')f=['v1','name',parts[0],parts[1],String(parts[2]),dClean(parts[3]).slice(0,24)];
  else if(kind==='duo')f=['v1','duo',parts[0],parts[1],dClean(parts[2]).slice(0,30)];
  else if(kind==='go')f=['v1','go',parts[0],dClean(parts[1]).slice(0,30)];
  else f=['v1',kind,parts[0],dClean(parts[1]).slice(0,30)];
  return RESULT_BASE+b64e(f.join('|'));
}

function runQuiz(qs,{onDone,onQuit,shuffleOpts}){
  const A=new Array(qs.length).fill(null);let qi=0;
  const Q2=qs.map(q=>shuffleOpts&&(q.type==='mc')?{...q,a:sampleN(q.a,q.a.length)}:q);
  const TYPE={yn:'예 / 아니요',mc:'상황 선택',ab:'밸런스 게임',slider:'슬라이더',multi:'2개 고르기'};
  function draw(){
    const q=Q2[qi],a=A[qi];
    $('app').innerHTML=`<section class="quiz"><div class="qhead"><div class="qmeta"><span><span class="n">${qi+1}</span> / ${Q2.length}</span><span>${TYPE[q.type]}</span></div><div class="bar" aria-hidden="true"><i style="width:${(qi+1)/Q2.length*100}%"></i></div></div>
      <div class="qcard" style="margin-top:14px"><span class="tag">QUESTION ${String(qi+1).padStart(2,'0')}</span><h2 id="qText">${esc(q.t)}</h2><div class="answers t-${q.type}" id="qAns" role="group" aria-labelledby="qText"></div></div>
      <div class="qnav" style="margin-top:14px"><button class="ghost" id="bPrev" type="button" ${qi?'':'disabled'}>이전 질문</button><button class="ghost" id="bQuit" type="button">그만하기</button></div></section>`;
    const box=$('qAns');
    if(q.type==='slider'){
      const v=a??q.def;
      box.innerHTML=`<div class="sl"><output id="slOut">${v}<small>${q.unit}</small></output><input id="slIn" type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}" aria-label="${esc(q.t)}"><div class="slscale"><span>${q.min}${q.unit}</span><span>${q.max}${q.unit}</span></div><button type="button" class="next" id="slNext">다음</button></div>`;
      $('slIn').addEventListener('input',e=>{$('slOut').innerHTML=e.target.value+`<small>${q.unit}</small>`});
      $('slNext').addEventListener('click',()=>{A[qi]=+$('slIn').value;next()});
    }else if(q.type==='multi'){
      const sel=a||[];
      box.innerHTML=`<div class="chips">${q.a.map((o,i)=>`<button type="button" data-m="${i}" aria-pressed="${sel.includes(i)}">${esc(o[0])}</button>`).join('')}</div><button type="button" class="next" id="mNext" ${sel.length?'':'disabled'}>다음 (${sel.length}/${q.max})</button>`;
      box.querySelector('.chips').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const i=+b.dataset.m;let s=A[qi]||[];
        s=s.includes(i)?s.filter(x=>x!==i):s.length<q.max?[...s,i]:[...s.slice(1),i];A[qi]=s;
        box.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',s.includes(+x.dataset.m)));$('mNext').disabled=!s.length;$('mNext').textContent=`다음 (${s.length}/${q.max})`});
      $('mNext').addEventListener('click',()=>{if((A[qi]||[]).length)next()});
    }else if(q.type==='ab'){
      box.innerHTML=`<button type="button" data-i="0" aria-pressed="${a===0}"><span class="abk">A</span><span>${esc(q.a[0][0])}</span></button><span class="vs" aria-hidden="true">VS</span><button type="button" data-i="1" aria-pressed="${a===1}"><span class="abk">B</span><span>${esc(q.a[1][0])}</span></button>`;
    }else{
      box.innerHTML=q.a.map((o,i)=>`<button type="button" data-i="${i}" aria-pressed="${a===i}"><span class="k">${i+1}</span><span>${esc(o[0])}</span></button>`).join('');
    }
    box.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;A[qi]=+b.dataset.i;box.querySelectorAll('button[data-i]').forEach(x=>x.setAttribute('aria-pressed',x===b));setTimeout(next,170)});
    $('bPrev').addEventListener('click',()=>{if(qi>0){qi--;draw()}});
    $('bQuit').addEventListener('click',onQuit);
  }
  function next(){if(qi<Q2.length-1){qi++;draw()}else onDone(A,Q2)}
  draw();window.scrollTo({top:0});
}

function hubView(){

function enter(a){setArcTab('test');cur=a;applyTheme(a.th);$('allBtn').hidden=false;document.title=a.title+' · 킥킥 | 피파고수'}
function failView(err){

// 친구가 보낸 결과 링크 열기
function openShared(d){
  const p=parseD(d);
  if(!p){cur=null;hubView();return}
  if(p.v!=='v1'){   // 다른 버전 링크: 글자만 보여주고 나도 해보기
    cur=null;applyTheme(HUB_TH);$('allBtn').hidden=false;
    $('app').innerHTML=`<section class="intro"><div class="friend"><small>친구 결과</small>${esc(p.label)}</div><a class="cta" href="#/">나도 해보기</a></section>`;renderAds();return;
  }
  const a=APPS.find(x=>x.id===p.app);if(!a){cur=null;hubView();return}
  enter(a);
  try{
    if(p.kind==='go'){a.start();const sec=$('app').firstElementChild;if(sec)sec.insertAdjacentHTML('afterbegin',`<div class="friend"><small>친구 결과</small>${esc(p.label)}</div>`);return}
    if(!a.shared||a.shared(p)===false){cur=null;hubView()}
  }catch(err){failView(err)}
}
function setArcTab(kind){$('arcTabs').querySelectorAll('a').forEach((a,i)=>{if((kind==='game')===(i===1))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function gameHub(){applyTheme(HUB_TH);setArcTab('game');$('allBtn').hidden=true;document.title='킥킥 · 미니게임 | 피파고수';const stop=window.FGArcade.mount($('app'),()=>renderAds());cur={stop};window.scrollTo({top:0});renderAds()}
function route(){
  if(cur&&cur.stop)cur.stop();
  const qd=new URLSearchParams(location.search).get('d');
  if(qd!==null){
    // 쿼리는 읽자마자 주소에서 지워요. 이후 해시 이동(다른 테스트, 나도 해보기)이 친구 결과에 막히지 않게.
    try{history.replaceState(null,'',BASE_PATH)}catch{}
    openShared(qd);return;
  }
  let id=(location.hash.match(/^#\/([\w-]+)/)||[])[1];
  if(id&&ALIAS[id]){id=ALIAS[id];try{history.replaceState(null,'',BASE_PATH+'#/'+id)}catch{}}
  if(id==='games'){gameHub();return}
  const a=APPS.find(x=>x.id===id);
  if(!a){cur=null;hubView();return}
  enter(a);
  try{a.start()}catch(err){failView(err)}
}
window.addEventListener('hashchange',route);
// 위임 클릭 처리를 두어 타일 내부의 아이콘·텍스트 터치도 항상 같은 라우트로 이어줘요.
document.addEventListener('click',e=>{
  const tile=e.target.closest('.tile[href^="#/"]'); if(!tile)return;
  const next=tile.getAttribute('href'), id=(next.match(/^#\/([\w-]+)/)||[])[1];
  if(!APPS.some(a=>a.id===id))return;
  if(location.hash===next)route(); else location.hash=next;
});

async function finish(){

const flipOf=(a,b)=>{const f=FLIP.find(x=>x[0]===a&&x[1]===b||x[0]===b&&x[1]===a);return f?f[2]:null};

// 별명 계산. mode 0 = 기본, 1 = T1·T2 바꿔서, 2 = 합성형↔상황형 반대 방식 (불가능하면 null)
function compute(raw,code,mode=0){
  const N=callName(raw),isKo=/^[가-힣]+$/.test(N),L=N.slice(-1);
  const seed='kk-nick:v1|'+raw+'|'+code,R=k=>rng(hashStr(seed+'|'+k));   // 용도별 시드 → 별명 바꾸기 후보끼리도 일관
  const picks=[...code].map((c,i)=>QS[i][1][+c]);
  const cnt={};TG.forEach(t=>cnt[t]=0);picks.forEach(o=>cnt[o[1]]++);
  // 1. T1·T2 (동점이면 모순 쌍 우선, 그래도 동점이면 시드)
  const r1=R('t'),c1=Math.max(...TG.map(t=>cnt[t])),top=TG.filter(t=>cnt[t]===c1);let T1,T2;
  if(top.length>=2){
    const pairs=[];top.forEach((a,i)=>top.slice(i+1).forEach(b=>pairs.push([a,b])));
    const fp=pairs.filter(([a,b])=>flipOf(a,b)),pr=pickBy(fp.length?fp:pairs,r1);[T1,T2]=r1()<.5?pr:[pr[1],pr[0]];
  }else{
    T1=top[0];const rest=TG.filter(t=>t!==T1&&cnt[t]>0),c2=Math.max(...rest.map(t=>cnt[t])),sec=rest.filter(t=>cnt[t]===c2),fs=sec.filter(t=>flipOf(T1,t));
    T2=pickBy(fs.length?fs:sec,r1);
  }
  // 근거 조각·칩: 태그별로 사용자가 고른 보기 중 1개 (바꾸기 전에 정해 둠)
  const rp=R('p'),pk={};[T1,T2].forEach(t=>pk[t]=pickBy(picks.filter(o=>o[1]===t),rp));
  const third=pickBy(picks.filter(o=>o!==pk[T1]&&o!==pk[T2]),rp);
  if(mode===1)[T1,T2]=[T2,T1];
  const canComp=isKo&&!!DICT[L];
  let method=canComp?'comp':'sit';
  if(mode===2){if(!canComp)return null;method='sit'}
  const flip=flipOf(T1,T2);
  let nick,sub,word=null,fit=false,hap=null;
  if(method==='comp'){
    const ws=DICT[L];
    word=ws.length===1?ws[0]:(ws.find(w=>w[1].includes(T1))||ws.find(w=>w[1].includes(T2))||pickBy(ws,R('w')));
    hap=N+word[0].slice(1);                      // 윤재 + 재투입 → 윤재투입, 수빈 + 빈 공간 침투 → 수빈 공간 침투
    fit=word[1].includes(T1)||word[1].includes(T2);
    nick=fit?word[2].replace('{합}',hap):pickBy(MOD[T1],R('m'))+' '+hap;
    sub=flip||(fit?word[3]:pickBy(LINE[T1],R('l')));
  }else{
    nick=pickBy(SIT[T1],R('s')).replace('{N}',N);
    sub=flip||pickBy(LINE[T2],R('l'));
  }
  // 8. 길이 검사 (별명 16자 이하)
  if(nick.length>16){
    if(method==='comp'){
      const m=byLen(MOD[T1]).find(x=>(x+' '+hap).length<=16);
      if(m)nick=m+' '+hap;
      else{nick=hap;const pre=byLen(MOD[T1])[0]+', '+sub;if(pre.length<=24)sub=pre}
    }else{
      const alt=byLen(SIT[T1]).map(x=>x.replace('{N}',N)).find(x=>x.length<=16);
      nick=alt||N;
    }
  }
  const why=(method==='comp'?`'${L}' → ${word[0]} · `:'')+`${pk[T1][2]} + ${pk[T2][2]}`;
  const chips=[...new Set([pk[T1][3],pk[T2][3],third[3]])];
  return {raw,N,code,T1,T2,method,fit,word:word&&word[0],nick,sub,why,chips,num:NUM[T1][0],numLine:NUM[T1][1]};
}

async function finish(a,qs){
  const sc={},order=[];a.forEach((x,i)=>qs[i].a[x][1].forEach(k=>{sc[k]=(sc[k]||0)+1;if(!order.includes(k))order.push(k)}));
  // 쏠림 보정: 득표 ÷ 그 구단이 선택지에 나온 횟수 (선택지에 많이 들어간 구단이 유리하지 않게)
  const norm=x=>sc[x]/(APPEAR[x]||1);
  const rk=order.sort((p,q)=>norm(q)-norm(p)),k=rk[0];
  const total=Object.values(sc).reduce((s,x)=>s+x,0),pc=Math.min(98,Math.round(55+sc[k]/total*90));
  show(k,pc,rk[1]||'lfc');
}
