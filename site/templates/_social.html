<div class="fg-floating-chat" id="fgFloatingChat">
  <section class="fg-social fg-chat-panel" id="fgLiveChat" aria-labelledby="fgChatTitle" hidden>
    <div class="fg-social-head"><h2 id="fgChatTitle">실시간 채팅</h2><div class="fg-chat-header-actions"><span id="fgChatState" role="status">연결 대기</span><button id="fgChatClose" type="button" aria-label="채팅창 닫기" title="닫기">×</button></div></div>
    <div id="fgChatLog" class="fg-chat-log" role="log" aria-label="최근 채팅"></div>
    <form id="fgChatForm"><input name="body" maxlength="300" required placeholder="메시지 입력" aria-label="채팅 메시지" autocomplete="off" disabled><button disabled>전송</button></form>
    <div class="fg-social-meta"><span id="fgChatHint" role="status"></span><span class="fg-chat-actions"><button id="fgClearChat" type="button">내역 삭제</button><button id="fgUnblock" type="button" hidden>차단 초기화</button></span></div>
    <button class="fg-contact-launch" type="button" data-fg-contact><b>피파고수에게 건의하기</b><small>건의 · 오류 · 개선 요청</small><span aria-hidden="true">→</span></button>
  </section>
  <button id="fgChatToggle" class="fg-chat-toggle" type="button" aria-controls="fgLiveChat" aria-expanded="false" aria-label="실시간 채팅 열기" title="실시간 채팅"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-3.4-.7L4 20l.8-4.2A8.5 8.5 0 1 1 20.5 11.5Z"/><path d="M8 11.5h.01m4 0h.01m4 0h.01" stroke-width="2.8"/></svg></button>
</div>
<dialog id="fgContactDialog" class="fg-contact-dialog" aria-labelledby="fgContactTitle"><form id="fgContactForm"><div class="fg-social-head"><h2 id="fgContactTitle">피파고수에게 건의하기</h2><button type="button" id="fgContactClose" aria-label="닫기">×</button></div><p>작성한 의견은 운영자만 확인합니다. 비회원도 접수할 수 있어요.</p><label>구분<select name="kind"><option value="suggestion">기능 제안</option><option value="bug">오류 제보</option><option value="improvement">개선 요청</option><option value="other">기타 의견</option></select></label><label>내용<textarea name="body" minlength="5" maxlength="2000" required rows="5" placeholder="개인정보·비밀번호는 입력하지 마세요."></textarea></label><small class="fg-contact-notice">만 14세 이상 이용 가능 · 접수 내용은 문의 처리에 최대 180일간 사용됩니다. <a href="/privacy">개인정보처리방침</a></small><button type="submit">의견 보내기</button><p id="fgContactStatus" role="status"></p></form></dialog>
